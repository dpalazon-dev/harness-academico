name: Bug report
description: Report something that is not working as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve HarnessAcademico. Describe what you observed; you do not need to know the cause. English or Spanish are both fine.

        **This report is public.** Remove API keys, tokens, passwords and private information before posting. Never attach `auth.json`, credential files or your data folders. Share only the study content you are comfortable making public.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: HarnessAcademico version or build
      description: The installer filename (for example `HarnessAcademico-0.1.0-x64-setup.exe`) or the source commit. If you cannot find it, write "unknown".
    validations:
      required: true
  - type: input
    id: operating_system
    attributes:
      label: Operating system
      description: For example, Windows 11 24H2. Only Windows x64 is tested.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps or context (optional)
      description: How can we reproduce it? If it is intermittent or you are unsure, describe what you were doing when it happened.
    validations:
      required: false
  - type: input
    id: provider_model
    attributes:
      label: Provider and model (if relevant)
      description: Include the provider, model and connection type (API key, subscription, Claude Code, custom endpoint). Do not include any keys or tokens.
    validations:
      required: false
  - type: textarea
    id: log_excerpt
    attributes:
      label: Log excerpt (optional)
      description: The last lines of `%APPDATA%\HarnessAcademico\logs\main.log` around the problem. Remove paths, names and anything private first.
      render: text
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or other context (optional)
      description: Attach screenshots or add other relevant details. Check for private information before posting.
    validations:
      required: false

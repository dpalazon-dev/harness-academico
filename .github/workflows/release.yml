name: Desktop release

on:
  push:
    tags: ["v*"]
  # Manual runs are artifact-only, unsigned, and NEVER create a release.
  # Use this to rehearse the Windows installer build before tagging.
  workflow_dispatch:

permissions:
  contents: read

# Serialize separate runs for the same ref; never cancel an upload in flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Release gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run plugins:setup
      - name: Tag must match package.json
        if: github.event_name == 'push'
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const {version} = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (process.env.GITHUB_REF_NAME !== `v${version}`) {
              console.error("Release tag must equal v" + version);
              process.exit(1);
            }
          '
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint

  draft:
    name: Prepare one draft
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # This job succeeds without creating anything on manual rehearsals.
      # Preparing once avoids the publisher's list-miss/create race between OS jobs.
      - name: Create or reuse the tag's draft
        if: github.event_name == 'push'
        uses: actions/github-script@v9
        with:
          script: |
            const {owner, repo} = context.repo;
            const tag = context.ref.replace(/^refs\/tags\//, "");
            const version = tag.slice(1);
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner, repo, per_page: 100,
            });
            const matches = releases.filter(release =>
              release.tag_name === tag || release.tag_name === version);
            if (matches.length > 1) {
              throw new Error(`Multiple releases match ${tag}; resolve them before uploading.`);
            }
            if (matches.length === 1) {
              if (!matches[0].draft) {
                throw new Error(`${tag} is already published; refusing to modify it.`);
              }
              core.info(`Reusing draft ${matches[0].id} for ${tag}`);
              return;
            }
            const {data} = await github.rest.repos.createRelease({
              owner, repo, tag_name: tag, name: version, draft: true,
            });
            core.info(`Created draft ${data.id} for ${tag}`);

  # HarnessAcademico ships only the Windows x64 installer (unsigned, no
  # update feed). desktop:dist:win builds, smoke-tests the standalone server
  # and the packaged app, and refuses local data or credentials in the package.
  package:
    name: Package (windows-x64)
    needs: [quality, draft]
    permissions:
      contents: write
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run plugins:setup
      - name: Native renderer tests on this OS
        run: npx electron --import tsx --test tests/pdf-native-render.test.ts tests/pdf-ops.test.ts tests/svg-native-render.test.ts tests/browser-service.test.ts
        env:
          NODE_ENV: test
          ELECTRON_RUN_AS_NODE: "1"
      - name: Build and verify the Windows installer
        run: npm run desktop:dist:win
      - name: SHA-256 of the installer
        run: |
          set -euo pipefail
          cd dist
          installer=$(ls HarnessAcademico-*-x64-setup.exe)
          sha256sum "$installer" > "$installer.sha256"
          cat "$installer.sha256"
      - name: Upload installer and checksum to the tag's draft
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/HarnessAcademico-*-x64-setup.exe dist/HarnessAcademico-*-x64-setup.exe.sha256 --clobber
      # The last gate before a human publishes. Read-only: it never creates,
      # edits, publishes, or deletes anything.
      - name: Verify the draft holds exactly the installer and its checksum
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          installer="HarnessAcademico-$version-x64-setup.exe"
          draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)
          [[ "$draft" == "true" ]] || { echo "::error::$GITHUB_REF_NAME is not a draft"; exit 1; }
          assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '[.assets[].name] | sort | join(" ")')
          [[ "$assets" == "$installer $installer.sha256" ]] || { echo "::error::Unexpected draft assets: $assets"; exit 1; }
          check="$RUNNER_TEMP/draft-check"
          mkdir -p "$check"
          gh release download "$GITHUB_REF_NAME" --dir "$check" --pattern "$installer" --pattern "$installer.sha256"
          (cd "$check" && sha256sum -c "$installer.sha256")
      - name: Save installer (rehearsals and pushes)
        uses: actions/upload-artifact@v7
        with:
          name: harnessacademico-windows-x64
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/HarnessAcademico-*-x64-setup.exe
            dist/HarnessAcademico-*-x64-setup.exe.sha256
